name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTALASESMEN_D8917 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTALASESMEN_D8917 }}'
          channelId: live
          projectId: portalasesmen-d8917

      - name: Petunjuk jika Secret belum diset
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTALASESMEN_D8917 == '' }}
        run: |
          echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_PORTALASESMEN_D8917 belum diset di GitHub Secrets!"
          echo "Kunjungi: https://github.com/aprelryu21/portalasesmen/settings/secrets/actions"
          echo "Tambahkan secret baru dengan nama FIREBASE_SERVICE_ACCOUNT_PORTALASESMEN_D8917 dan isi dengan JSON key Service Account Firebase Anda."
          exit 1

